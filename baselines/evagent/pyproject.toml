[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evagent"
version = "0.1.1"
description = "Scalable zero-shot RNA fitness ranking with structured agent reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-socket==0.8.1", "ruff>=0.9"]
analysis = ["matplotlib>=3.7"]
agent = [
    "deepagents==0.7.13; python_version >= '3.11'",
    "langchain-google-genai==4.4.0; python_version >= '3.11'",
    "langgraph-checkpoint-sqlite==3.1.1; python_version >= '3.11'",
]
provider = ["google-genai==2.22.0; python_version >= '3.10'"]
evidence = ["gemmi==0.7.3", "ViennaRNA==2.7.2"]
research = ["paper-qa==2026.8.12; python_version >= '3.11'", "barnaba==0.1.9", "gemmi==0.7.3", "ViennaRNA==2.7.2"]
framework = ["langchain==1.4.0; python_version >= '3.11'"]

[project.scripts]
evagent = "evagent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evagent*"]

[tool.setuptools.package-data]
"evagent.integrated" = ["knowledge/*.md", "knowledge/literature/*.json", "knowledge/structures/*.json", "knowledge/structures/*/*.pdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --disable-socket --allow-unix-socket"
markers = ["live: calls the live Gemini API"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
