[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutabench"
version = "0.1.0"
description = "Reproducible evaluation of biomolecular variant-effect prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "kevinhyj"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.7,<4"]
data = ["huggingface-hub>=0.24,<2"]

[project.scripts]
mutabench = "mutabench.__main__:main"

[project.urls]
Repository = "https://github.com/kevinhyj/MutaBench"

[tool.setuptools.packages.find]
include = ["mutabench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

